"openapi: 3.0.0\ninfo:\n  title: Catalogs API\n  version: 1.18.0\n  description: |\n    Open source clients:\n    - [pc-client-slim](https://github.com/alex-ello/pc-client-slim) PHP based opensource client\nsecurity:\n  - ApiKey: []\ntags:\n  - name: Ip\n  - name: Catalogs\n  - name: Cars\n  - name: Groups\n  - name: Parts\n  - name: Groups tree\n    description: \"Attention! You must use the groups2 and parts2 methods for truck catalogs.\"\npaths:\n  /ip/:\n    get:\n      operationId: getIp\n      tags:\n        - Ip\n      summary: Get user ip\n      responses:\n        '200':\n          description: Id\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Ip'\n  /catalogs/:\n    get:\n      operationId: getCatalogs\n      tags:\n        - Catalogs\n      summary: Get available catalogs\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n      responses:\n        '200':\n          description: Ok\n          content:\n            application/json:\n              schema:\n                title: array\n                description: Catalog list\n                type: array\n                items:\n                  $ref: '#/components/schemas/Catalog'\n  '/catalogs/{catalogId}/models/':\n    get:\n      operationId: getModels\n      tags:\n        - Cars\n      summary: Get catalog car models\n      security:\n        - ApiKey: []\n      parameters:\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n      responses:\n        '200':\n          description: Model list\n          content:\n            application/json:\n              schema:\n                title: Array\n                type: array\n                items:\n                  $ref: '#/components/schemas/Model'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n        '404':\n          $ref: '#/components/responses/notFound'\n  '/catalogs/{catalogId}/cars2/':\n    get:\n      operationId: getCars2\n      tags:\n        - Cars\n      summary: Get car list of catalog\n      description: Attention! Vehicle identifier may change over time.\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: modelId\n          in: query\n          description: Model id\n          required: true\n          schema:\n            type: string\n        - name: parameter\n          in: query\n          description: Filter cars by car parameter indexes (idx)\n          required: false\n          style: form\n          explode: false\n          schema:\n            type: array\n            items:\n              type: array\n              items:\n                $ref: '#/components/schemas/CarParameterIdx'\n        - name: page\n          in: query\n          required: false\n          description: |-\n            Page number (pagination). \n            Page number value must be greater than 0. Can output 25 cars on page\n          schema:\n            type: integer\n            minimum: 0\n      responses:\n        '200':\n          description: OK\n          headers:\n            X-Total-Count:\n              schema:\n                type: integer\n          content:\n            application/json:\n              schema:\n                title: array\n                description: Car list\n                type: array\n                items:\n                  $ref: '#/components/schemas/Car2'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n  '/catalogs/{catalogId}/cars2/{carId}':\n    get:\n      operationId: getCarsById2\n      tags:\n        - Cars\n      summary: GET catalog car by id\n      description: Attention! Vehicle identifier may change over time.\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: carId\n          in: path\n          description: Car id\n          required: true\n          schema:\n            type: string\n        - name: criteria\n          in: query\n          description: criteria\n          required: false\n          schema:\n            type: string\n      responses:\n        '200':\n          description: OK\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Car2'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n  '/catalogs/{catalogId}/cars-parameters/':\n    get:\n      operationId: getCarsParameters\n      tags:\n        - Cars\n      summary: Get cars filters of selected catalog\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: modelId\n          in: query\n          description: Model id\n          required: true\n          schema:\n            type: string\n        - name: parameter\n          in: query\n          description: Filter parameters by idx\n          required: false\n          style: form\n          explode: false\n          example: 5651b9c4e2f55b54efe465354b3491e7,59e742688f05ca5ecc71a35cc2ff31c5\n          schema:\n            type: array\n            items:\n              type: array\n              items:\n                $ref: '#/components/schemas/CarParameterIdx'\n      responses:\n        '200':\n          description: Filter\n          headers:\n            X-Cars-Count:\n              description: Cars count filtered by parameters\n              schema:\n                type: integer\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/CarParameterInfo'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '422':\n          $ref: '#/components/responses/parameterMissing'\n  '/catalogs/{catalogId}/groups2/':\n    get:\n      operationId: getGroups\n      tags:\n        - Groups\n      summary: Get catalog groups\n      description: >-\n        With empty identifier shows main groups of catalog. It is necessary to\n        select groups by ID until the \"hasParts\" value is true. The \"hasParts\"\n        value indicates that the group contains spare parts. The list of spare\n        parts can be received by the method parts2.\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: carId\n          in: query\n          schema:\n            type: string\n          required: true\n        - name: groupId\n          in: query\n          required: false\n          description: Group id\n          schema:\n            type: string\n        - name: criteria\n          in: query\n          required: false\n          description: >-\n            Filters outcoming groups depending on criteria string. Criteria\n            string can obtain from \"car/info\" method\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Catalog groups\n          content:\n            application/json:\n              schema:\n                title: Array\n                type: array\n                items:\n                  $ref: '#/components/schemas/Group'\n              example:\n                - id: \"MfCfmoAxMjI4fEE\"\n                  hasSubgroups: true\n                  hasParts: false\n                  name: \"Accessories\"\n                  img: \"//img.example.com/r/250x250/land_rover_2014_12/1228/A.png\"\n                  description: \"\"\n                - id: \"IzLwn5qAMTIyOHxB8J-agUEwMfCfmoJBMDEwMDV8TFQwMTIwPD4\"\n                  hasSubgroups: false\n                  hasParts: true\n                  name: \"Auxiliary Lighting-Fog Lamps\"\n                  img: \"//img.example.com/r/250x250/land_rover_2014_12/1228/lt0120().png\"\n                  description: \"\"\n          links:\n            getSubgroups:\n              operationId: getGroups\n              parameters:\n                catalogId: '$request.path.catalogId'\n                carId: '$request.query.carId'\n                groupId: '$response.body#/0/id'\n                criteria: '$request.query.criteria'\n              description: >-\n                If parameter `hasParts: false`\n            getParts:\n              operationId: getParts\n              parameters:\n                catalogId: '$request.path.catalogId'\n                carId: '$request.query.carId'\n                groupId: '$response.body#/0/id'\n                criteria: '$request.query.criteria'\n              description: >-\n                If parameter `hasParts: true`\n\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n        '404':\n          $ref: '#/components/responses/notFound'\n  /cars/vin-validator:\n    get:\n      operationId: vinValidate\n      security:\n        - ApiKey: []\n      tags:\n        - Cars\n      summary: Checking the vin code for errors\n      description: Validation and normalization of the VIN code according to the general rules of formation\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: vin\n          in: query\n      responses:\n        '200':\n          description: Ok\n          content:\n            application/json:\n              schema:\n                title: Array\n                type: array\n                items:\n                  $ref: '#/components/schemas/CarValidate'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n  /car/info:\n    get:\n      operationId: getCarInfo\n      security:\n        - ApiKey: []\n      tags:\n        - Cars\n      summary: Get car info by VIN or FRAME\n      description: You may specify VIN or FRAME number in query. Attention! Vehicle identifier may change over time.\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: q\n          in: query\n          description: >-\n            Automatically detects type of input data and performs search of cars\n            by VIN or FRAME number depending on input data\n          schema:\n            type: string\n        - name: catalogs\n          in: query\n          description: List of comma-separated Catalog IDs for search by vin or frame in selected catalogs\n          explode: false\n          schema:\n            type: string\n            example: kia,bmw,chevrolet,hyundai\n\n      responses:\n        '200':\n          description: Ok\n          content:\n            application/json:\n              schema:\n                title: Array\n                type: array\n                items:\n                  $ref: '#/components/schemas/CarInfo'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n  '/catalogs/{catalogId}/parts2':\n    get:\n      operationId: getParts2\n      tags:\n        - Parts\n      summary: Get catalog parts.\n      description: >-\n        Get catalog parts. In case you receive IDs of groups with the value\n        \"hasParts=false\", you get error 400 (No details found with specified\n        parameters).\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - $ref: '#/components/parameters/XRedirectTemplate'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: carId\n          in: query\n          description: Car id\n          required: true\n          schema:\n            type: string\n        - name: groupId\n          in: query\n          description: Group id\n          required: true\n          schema:\n            type: string\n        - name: criteria\n          in: query\n          description: Additional criteria string\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Parts list\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Parts'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n        '404':\n          description: No details found with specified parameters\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  '/catalogs/{catalogId}/groups-suggest':\n    get:\n      operationId: getGroupsSuggest\n      tags:\n        - Groups\n      summary: Get group suggest.\n      description: Suggest parts with relative to group id\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: q\n          in: query\n          description: First letters of searching part\n          required: true\n          example: 'bat'\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Suggest list\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/Suggest'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n        '404':\n          description: Search string is empty\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  '/catalogs/{catalogId}/groups-by-sid':\n    get:\n      deprecated: true\n      operationId: getGroupsBySid\n      tags:\n        - Groups\n      summary: Get groups by search id.\n      description: Get groups by search id\n      security:\n        - ApiKey: []\n      parameters:\n        - $ref: '#/components/parameters/AcceptLanguage'\n        - name: catalogId\n          in: path\n          description: Catalog id\n          required: true\n          schema:\n            type: string\n            default: bmw\n        - name: sid\n          in: query\n          description: Search id from group suggest\n          required: true\n          example: '12345'\n          schema:\n            type: string\n        - name: carId\n          in: query\n          description: Car id\n          required: true\n          schema:\n            type: string\n        - name: criteria\n          in: query\n          description: Additional criteria string\n          schema:\n            type: string\n        - name: text\n          in: query\n          description: This field is the name of the part. After searching for groups by sid, we can sort the groups by text, where there may be a part with this name.\n          schema:\n            type: string\n      responses:\n        '200':\n          description: Suggest list\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: '#/components/schemas/Group'\n        '400':\n          $ref: '#/components/responses/badRequest'\n        '403':\n          $ref: '#/components/responses/accessDeny'\n        '404':\n          description: Search string is empty\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /example/prices:\n    get:\n      operationId: \"getExamplePrices\"\n      summary: \"Get prices of part\"\n      description: |\n        This endpoint is a demonstration example showing how to retrieve information about prices and availability of parts by unique product code and brand. It is intended for developers and API architects as an illustration of potential functionality, not as a ready-to-use solution for production environments.\n      tags:\n        - Example\n      parameters:\n        - in: \"query\"\n          required: true\n          name: \"code\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"brand\"\n          required: true\n          schema:\n            type: \"string\"\n      responses:\n        200:\n          description: \"\"\n          content:\n            application/json:\n              schema:\n                type: \"array\"\n                items:\n                  $ref: \"#/components/schemas/ExamplePricesResponse\"\n        default:\n          description: Any error 400 - 500\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /catalogs/{catalogId}/groups-tree:\n    get:\n      operationId: \"Get groups tree\"\n      description: \"Get groups tree\"\n      tags:\n        - Groups tree\n      parameters:\n        - in: \"path\"\n          required: true\n          name: \"catalogId\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"carId\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"criteria\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"cached\"\n          description: A flag that determines whether the general unfiltered group tree should be retrieved from the cache or filtered tree with increased latency should be retrieved.\n          schema:\n            type: \"boolean\"\n      responses:\n        200:\n          description: \"\"\n          content:\n            application/json:\n              schema:\n                type: \"array\"\n                items:\n                  $ref: \"#/components/schemas/GroupsTreeResponse\"\n        default:\n          description: Any error 400 - 500\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\n  /catalogs/{catalogId}/schemas:\n    get:\n      operationId: \"Get schemas\"\n      description: \"Get schemas that lead to detail pages.\"\n      tags:\n        - Groups tree\n      parameters:\n        - in: \"query\"\n          required: true\n          name: \"carId\"\n          schema:\n            type: \"string\"\n        - in: \"path\"\n          required: true\n          name: \"catalogId\"\n          schema:\n            type: \"string\"\n            example: \"toyota\"\n        - in: \"query\"\n          name: \"branchId\"\n          description: Id for filter schemas by branch id. Branch id it is group id.\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"criteria\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"page\"\n          description: The page number. One response can contain a maximum of 24 elements.\n          schema:\n            type: \"integer\"\n            default: 0\n            minimum: 0\n        - in: \"query\"\n          name: \"partNameIds\"\n          description: Part name ids for filter schemas\n          example: \"56,85\"\n          schema:\n            type: \"string\"\n        - in: \"query\"\n          name: \"partName\"\n          description: Part name for filter schemas\n          example: \"Air filter\"\n          schema:\n            type: \"string\"\n      responses:\n        200:\n          description: \"\"\n          content:\n            application/json:\n              schema:\n                $ref: \"#/components/schemas/SchemasResponse\"\n          headers:\n            X-Total-Count:\n              schema:\n                type: integer\n              description: The total number of items available for extraction.\n        default:\n          description: Any error 400 - 500\n          content:\n            application/json:\n              schema:\n                $ref: '#/components/schemas/Error'\nservers:\n  - url: '/v1'\ncomponents:\n  responses:\n    accessDeny:\n      description: Access deny\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    parameterMissing:\n      description: Unprocessable Entity\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    notFound:\n      description: Not Found\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n    badRequest:\n      description: Bad Request\n      content:\n        application/json:\n          schema:\n            $ref: '#/components/schemas/Error'\n  securitySchemes:\n    ApiKey:\n      type: apiKey\n      description: Authorization by ApiKey\n      name: Authorization\n      in: header\n  schemas:\n    Ip:\n      properties:\n        ip:\n          description: ip value\n          type: string\n    CarParameterInfo:\n      properties:\n        key:\n          type: string\n        name:\n          type: string\n        values:\n          type: array\n          items:\n            type: object\n            properties:\n              idx:\n                $ref: '#/components/schemas/CarParameterIdx'\n              value:\n                type: string\n        sortOrder:\n          type: integer\n          description: 'You can sort the parameters in the external interface in the sort order \n                from minimum to maximum. The smaller the sortOrder, the higher the priority of the parameter.'\n    CarParameterIdx:\n      description: Index of car parameter (idx)\n      type: string\n    Parts:\n      description: Parts description\n      required:\n        - img\n        - partGroups\n      properties:\n        img:\n          description: URL of full-size parts group image\n          type: string\n        imgDescription:\n          description: Parts group description\n          type: string\n        brand:\n          description: Parts brand\n          type: string\n        partGroups:\n          description: Parts group list\n          type: array\n          items:\n            $ref: '#/components/schemas/PartsGroup'\n        positions:\n          description: Positions of blocks with a number on image\n          type: array\n          items:\n            description: Position of block with a part number on image\n            type: object\n            properties:\n              number:\n                description: Number on image\n                type: string\n              coordinates:\n                description:\n                  Coordinate data<br />\n                  X - horizontal coordinate relative to the upper left of the full-size image, in pixels<br />\n                  Y - vertical coordinate relative to the upper left of the full-size image, in pixels<br />\n                  H - height of block with a part number on the full-size image, in pixels<br />\n                  W - width of block with a part number on the full-size image, in pixels\n                type: array\n                items:\n                  description: 'array (X, Y, H, W)'\n                  type: number\n                minItems: 4\n                maxItems: 4\n    PartsGroup:\n      description: Parts group\n      type: object\n      required:\n        - parts\n      properties:\n        name:\n          description: Part name\n          type: string\n        number:\n          description: Parts group number\n          type: string\n        positionNumber:\n          description: Parts group position number on image\n          type: string\n        description:\n          description: Parts group description. Installation notes, applicability. Description of the part or group of parts.\n          type: string\n        parts:\n          description: Group detail list\n          type: array\n          items:\n            $ref: '#/components/schemas/Part'\n    Group:\n      description: Group\n      required:\n        - id\n        - name\n      properties:\n        id:\n          description: Group id\n          type: string\n        parentId:\n          description: Parent id. Can be `null` if there is no parent\n          type: string\n        hasSubgroups:\n          description: Indicates that the group has subgroups\n          type: boolean\n        hasParts:\n          description: Indicates that the group has parts\n          type: boolean\n        name:\n          description: Group name\n          type: string\n        img:\n          description: Group image\n          type: string\n        description:\n          description: Group description\n          type: string\n    Car2:\n      description: Car\n      required:\n        - id\n        - catalogId\n        - name\n      properties:\n        id:\n          description: |-\n            Is a car identifier in the Parts-Catalogs system; \n            this parameter is not constant and can change when updating catalogs\n          type: string\n        catalogId:\n          description: Catalog id\n          type: string\n        name:\n          description: Car name\n          type: string\n        description:\n          description: Car description\n          type: string\n        modelId:\n          description: Car model id\n          type: string\n          example: 'd3190764f126fabbf56bf3e36efbd56a'\n        modelName:\n          description: Car model name\n          type: string\n        modelImg:\n          description: Model image URL\n          type: string\n        vin:\n          description: Car vin\n          type: string\n        frame:\n          description: Car frame\n          type: string\n        criteria:\n          description: |-\n            Criteria is a parameter, which contains info by VIN taken from the \"car/info\" method; \n            this parameter is used to filter groups and parts for a specified VIN\n          type: string\n        brand:\n          description: Car brand\n          type: string\n        groupsTreeAvailable:\n          description: Groups tree method availability flag\n          type: boolean\n        parameters:\n          description: Car parameters\n          type: array\n          items:\n            type: object\n            properties:\n              idx:\n                type: string\n                description: hash id of car param\n              key:\n                type: string\n              name:\n                type: string\n              value:\n                type: string\n              sortOrder:\n                type: integer\n                description: 'You can sort the parameters in the external interface in the sort order \n                from minimum to maximum. The smaller the sortOrder, the higher the priority of the parameter.'\n    CarFilterValues:\n      title: Car filter\n      description: The values of the specific complectation parameter\n      properties:\n        name:\n          description: Parameter name\n          type: object\n          properties:\n            id:\n              description: Parameter id\n              type: string\n            key:\n              description: Inner key of parameter\n              type: string\n            text:\n              description: Parameter text\n              type: string\n        values:\n          description: Parameter value\n          type: array\n          items:\n            type: object\n            properties:\n              id:\n                type: string\n                description: Parameter value id\n              text:\n                type: string\n                description: Parameter value text\n    Model:\n      title: Models\n      description: Car model\n      required:\n        - id\n        - name\n      properties:\n        id:\n          description: Model id\n          type: string\n        name:\n          description: Model name\n          type: string\n        img:\n          description: Model image URL\n          type: string\n    Catalog:\n      title: Catalog\n      required:\n        - id\n        - name\n        - modelsCount\n        - actuality\n        - hasUniTree\n        - hasGroupTree\n        - hasVinCheck\n        - hasFrameCheck\n\n      properties:\n        id:\n          description: Catalog id\n          type: string\n        name:\n          description: Catalog name\n          type: string\n        modelsCount:\n          type: integer\n        actuality:\n          description: Catalog actuality\n          type: string\n        hasUniTree:\n          description: Does catalog have UNI Tree\n          type: boolean\n        hasGroupTree:\n          description: Does catalog have Group Tree\n          type: boolean\n        hasVinCheck:\n          description: Does catalog have vin search\n          type: boolean\n        hasFrameCheck:\n          description: Does catalog have frame search\n          type: boolean\n    Error:\n      title: Error\n      description: Error response to request\n      required:\n        - code\n        - message\n      properties:\n        code:\n          description: Response code\n          type: integer\n          format: int32\n        errorCode:\n          description: Error code\n          type: string\n        message:\n          description: Text message\n          type: string\n    CarValidate:\n      properties:\n        changed:\n          description: changed vin\n          type: string\n        original:\n          description: original vin\n          type: string\n        errors:\n          type: array\n          items:\n            type: object\n            properties:\n              errorCode:\n                type: string\n                example: 'VCx1700'\n              errorTranslate:\n                type: string\n                example: 'The number of characters must equal 17.'\n              details:\n                type: array\n                items:\n                  type: string\n                example:\n                  - 'The following characters were replaced: Q -> 0'\n                  - 'The following characters were replaced: I -> 1'\n    CarInfo:\n      properties:\n        title:\n          type: string\n        catalogId:\n          description: Catalog id\n          type: string\n        brand:\n          description: Car brand\n          type: string\n        modelId:\n          description: Car model id\n          type: string\n          example: '5bb58a3cab059a189ef92be181380fd5'\n        carId:\n          description: Car id\n          type: string\n        criteria:\n          description: 'Additional criterias to search in groups, subgroups and parts'\n          type: string\n        vin:\n          description: Car vin\n          type: string\n        frame:\n          description: Car frame\n          type: string\n        modelName:\n          description: Car model name\n          type: string\n        description:\n          description: Car description\n          type: string\n        groupsTreeAvailable:\n          description: Groups tree method availability flag\n          type: boolean\n        optionCodes:\n          description: Car option codes\n          type: array\n          items:\n            properties:\n              code:\n                type: string\n              description:\n                type: string\n        parameters:\n          description: Car parameters\n          type: array\n          items:\n            type: object\n            properties:\n              idx:\n                type: string\n                description: hash id of car param\n              key:\n                type: string\n              name:\n                type: string\n              value:\n                type: string\n              sortOrder:\n                type: integer\n                description: 'You can sort the parameters in the external interface in the sort order \n                from minimum to maximum. The smaller the sortOrder, the higher the priority of the parameter.'\n    Part:\n      description: Part\n      type: object\n      properties:\n        id:\n          description: Part id\n          type: string\n        nameId:\n          nullable: true\n          description: Name id\n          type: string\n        name:\n          description: Name\n          type: string\n        number:\n          description: Part number\n          type: string\n        notice:\n          type: string\n          description: |-\n            Short note.\n            It can has url for go to sections in gui.\n            To get url in this field, you must send header with template for your gui url.\n        description:\n          description: |-\n            Part description. Installation notes, applicability. Replacements. Description and characteristics of the part.\n            It can has url for go to sections in gui.\n            To get url in this field, you must send header with template for your gui url.\n          type: string\n        positionNumber:\n          description: Position number on image group\n          type: string\n        url:\n          description: Search results URL\n          type: string\n    Suggest:\n      description: suggest\n      type: object\n      properties:\n        sid:\n          description: search id\n          type: string\n          example: '12345'\n        name:\n          description: Name\n          type: string\n          example: 'battery'\n    ExamplePricesResponse:\n      properties:\n        id:\n          type: \"string\"\n        title:\n          type: \"string\"\n        code:\n          type: \"string\"\n        brand:\n          type: \"string\"\n        price:\n          type: \"string\"\n        basketQty:\n          type: \"string\"\n        inStockQty:\n          type: \"string\"\n        rating:\n          type: \"string\"\n        delivery:\n          type: \"string\"\n        payload:\n          type: \"object\"\n          additionalProperties:\n            type: \"string\"\n    SchemasResponse:\n      properties:\n        group:\n          nullable: true\n          oneOf:\n            - $ref: \"#/components/schemas/Group\"\n        list:\n          type: \"array\"\n          items:\n            $ref: \"#/components/schemas/Schema\"\n    Schema:\n      properties:\n        groupId:\n          nullable: false\n          type: \"string\"\n          example: \"IzLwn5qAMDA08J-agTg0RTQyOULwn5SwMjI18J-QkjU4NfCfkIk4NEU0MjlC\"\n        img:\n          nullable: true\n          type: \"string\"\n          example: \"//img.parts-catalogs.com/toyota_2022_12/usa/84E429B.png\"\n        name:\n          nullable: false\n          type: \"string\"\n          example: \"ENGINE & TRANSMISSION ILLUST NO. 1 OF 7\"\n        description:\n          nullable: true\n          type: \"string\"\n          example: \"\"\n        partNames:\n          type: \"array\"\n          items:\n            $ref: \"#/components/schemas/PartName\"\n    PartName:\n      properties:\n        id:\n          nullable: false\n          type: \"string\"\n        name:\n          nullable: false\n          type: \"string\"\n    GroupsTreeResponse:\n      properties:\n        id:\n          nullable: false\n          type: \"string\"\n        name:\n          nullable: false\n          type: \"string\"\n        parentId:\n          nullable: true\n          type: \"string\"\n        subGroups:\n          nullable: false\n          type: \"array\"\n          items:\n            $ref: \"#/components/schemas/GroupsTree\"\n    GroupsTree:\n      properties:\n        id:\n          nullable: false\n          type: \"string\"\n        name:\n          nullable: false\n          type: \"string\"\n        parentId:\n          nullable: true\n          type: \"string\"\n        subGroups:\n          nullable: false\n          type: \"array\"\n          example: [ ]\n  parameters:\n    AcceptLanguage:\n      name: Accept-Language\n      in: header\n      description: Language of return data\n      schema:\n        type: string\n        default: en\n        enum: [en, ru, de, bg, fr, es, he]\n    XRedirectTemplate:\n      name: x-redirect-template\n      in: header\n      description:  |-\n        Template for your gui url.\n        In template must be 2 templates separated by commas for go to group list and parts list.\n        If vin is not used, then you do not need to pass criteria and vin to the template.\n      schema:\n        type: string\n        example: parts <a href=\"#/parts?catalogId=%catalogId%&modelId=%modelId%&carId=%carId%&groupId=%groupId%&q=%vin%&criteria=%criteria%\">%text%</a>, groups <a href=\"#/groups?catalogId=%catalogId%&modelId=%modelId%&carId=%carId%&groupsPath=%groupId%&q=%vin%&criteria=%criteria%\">%text%</a>"