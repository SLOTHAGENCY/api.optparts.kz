openapi: "3.0.3"
info:
  description: "API PartsIndex предоставляет всеобъемлющий доступ к данным об автозапчастях. Он включает в себя подробную базу данных с изображениями автозапчастей, информацию об оригинальных и неоригинальных деталях, названиях, размерах и других характеристиках. Также предоставляет доступ к базе аналогов и информацию о применимости деталей к конкретным маркам автомобилей. API поддерживает REST для простой интеграции и использования, а также обеспечивает регулярные обновления данных и поддержку."
  version: "1.2.0"
  title: "Parts Index"
  contact:
    email: "support@tradesoft.pro"
servers:
  - url: "https://api.parts-index.com"
tags:
  - name: "Brands"
  - name: "Entities"
  - name: "Relations"
  - name: "Cars By Part"
  - name: "Catalogs"
  - name: "Cars"
  - name: "Parts By VIN"
security: []
paths:
  /v1/brands/by-part-code:
    get:
      tags:
        - "Brands"
      summary: "Получить список брендов по артикулу (Информация о детали)"
      description: >
        Запрос поможет вам определить какие бренды выпускают или ранее выпускали указанный вами артикул.<br>

        Давайте рассмотрим несколько примеров использования:<br>

        1. Вы хотите получить информацию о детали, но не уверены или не знаете точное название бренда.<br>

        2. Вы хотите использовать информацию о доступных брендах для вывода ее у себя на сайте. Например, в виде подсказки для пользователя.<br>

        3. Сверить список брендов, полученных по артикулу из других источников с базой PartsIndex и отфильтровать подозрительные (те, которых нет в базе).

      operationId: "brandsByPartCode"
      security:
        - ApiKeyAuth: ["access", "info"]
      parameters:
        - $ref: "#/components/parameters/code"
      responses:
        "200":
          $ref: "#/components/responses/BrandList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/brands/parse:
    get:
      tags:
        - "Brands"
      summary: "Получить информацию о бренде (Информация о детали)"
      operationId: "brandsByQuery"
      description: >
        Запрос поможет вам получить информацию об определенном бренде. Вы можете отправить название бренда из вашей базы, чтобы получить его точное название а также список доступных синонимов.<br>

        Давайте рассмотрим несколько примеров использования:<br>

        1. Вы хотите получить информацию о детали, но не уверены или не знаете точное название бренда.<br>

        2. Вы хотите навести порядок в собственной базе брендов.<br>

        3. Вы хотите улучшить качество вашего проекта, предоставляя покупателям информацию без дублей.<br>

        Вместо того чтобы тратить время на поиск синонимов названий брендов, вы можете просто использовать данный метод и получать готовый список альтернативных вариантов.

      security:
        - ApiKeyAuth: ["access", "info"]
      parameters:
        - $ref: "#/components/parameters/queryBrandParse"
      responses:
        "200":
          $ref: "#/components/responses/ParsedBrandList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/car/brands:
    get:
      tags:
        - "Cars"
      summary: "Получить список марок автомобилей (Каталог автотоваров)"
      operationId: "carBrands"
      security:
        - ApiKeyAuth: ["access", "car"]
      parameters:
        - $ref: "#/components/parameters/queryOptional"
      responses:
        "200":
          $ref: "#/components/responses/CarBrandList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/car/brands/{brandId}/models:
    get:
      tags:
        - "Cars"
      summary: "Получить список моделей автомобилей (Каталог автотоваров)"
      operationId: "carModels"
      security:
        - ApiKeyAuth: ["access", "car"]
      parameters:
        - $ref: "#/components/parameters/brandIdPath"
      responses:
        "200":
          $ref: "#/components/responses/CarModelList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/car/brands/{brandId}/models/{modelId}/generations:
    get:
      tags:
        - "Cars"
      summary: "Получить список поколений автомобилей (Каталог автотоваров)"
      operationId: "carGenerations"
      security:
        - ApiKeyAuth: ["access", "car"]
      parameters:
        - $ref: "#/components/parameters/brandIdPath"
        - $ref: "#/components/parameters/modelIdPath"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/GenerationList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/car/brands/{brandId}/models/{modelId}/generations/{generationId}/engines:
    get:
      tags:
        - "Cars"
      summary: "Получить список двигателей автомобилей (Каталог автотоваров)"
      operationId: "carEngines"
      security:
        - ApiKeyAuth: ["access", "car"]
      parameters:
        - $ref: "#/components/parameters/brandIdPath"
        - $ref: "#/components/parameters/modelIdPath"
        - $ref: "#/components/parameters/generationIdPath"
      responses:
        "200":
          $ref: "#/components/responses/EngineList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/cars:
    get:
      tags:
        - "Cars By Part"
      summary: "Получить список автомобилей по артикулу и бренду детали (Информация о детали)"
      operationId: "cars"
      security:
        - ApiKeyAuth: ["access", "old-apply"]
      parameters:
        - $ref: "#/components/parameters/codeParam"
        - $ref: "#/components/parameters/brandParam"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/CarApplyList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs:
    get:
      tags:
        - "Catalogs"
      summary: "Получить список каталогов (Каталог автотоваров)"
      operationId: "catalogs"
      parameters:
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/CatalogList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs/{catalogId}/entities:
    get:
      tags:
        - "Catalogs"
      summary: "Получить список деталей каталога (Каталог автотоваров)"
      operationId: "catalogEntities"
      security:
        - ApiKeyAuth: ["access", "catalogs", "catalog.*"]
      parameters:
        - $ref: "#/components/parameters/catalogId"
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/params"
        - $ref: "#/components/parameters/carGenerationId"
        - $ref: "#/components/parameters/carEngineId"
        - $ref: "#/components/parameters/language"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/queryOptional"
      responses:
        "200":
          $ref: "#/components/responses/CatalogEntityList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs/{catalogId}/entities/{id}:
    get:
      tags:
        - "Catalogs"
      summary: "Получить деталь каталога по ID (Каталог автотоваров)"
      operationId: "catalogEntityById"
      security:
        - ApiKeyAuth: ["access", "catalogs", "catalog.*"]
      parameters:
        - $ref: "#/components/parameters/catalogId"
        - $ref: "#/components/parameters/entityId"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/CatalogEntity"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs/{catalogId}/groups:
    get:
      tags:
        - "Catalogs"
      summary: "Получить список групп каталога (Каталог автотоваров)"
      operationId: "catalogGroups"
      security:
        - ApiKeyAuth: ["access", "catalogs", "catalog.*"]
      parameters:
        - $ref: "#/components/parameters/catalogId"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/GroupTree"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs/{catalogId}/params:
    get:
      tags:
        - "Catalogs"
      summary: "Получить параметры деталей каталога (Каталог автотоваров)"
      operationId: "catalogParams"
      security:
        - ApiKeyAuth: ["access", "catalogs", "catalog.*"]
      parameters:
        - $ref: "#/components/parameters/catalogId"
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/params"
        - $ref: "#/components/parameters/carGenerationId"
        - $ref: "#/components/parameters/carEngineId"
        - $ref: "#/components/parameters/language"
        - $ref: "#/components/parameters/queryOptional"
      responses:
        "200":
          $ref: "#/components/responses/ParamsList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/catalogs/{catalogId}/suggest:
    get:
      tags:
        - "Catalogs"
        - "Suggest"
      summary: "Подсказка для деталей каталога (Каталог автотоваров)"
      operationId: "catalogSuggests"
      security:
        - ApiKeyAuth: ["access", "catalogs", "catalog.*"]
      parameters:
        - $ref: "#/components/parameters/catalogId"
        - $ref: "#/components/parameters/groupId"
        - $ref: "#/components/parameters/querySuggest"
      responses:
        "200":
          $ref: "#/components/responses/CatalogSuggestItemList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/entities:
    get:
      tags:
        - "Entities"
      summary: "Получить информацию о детали по артикулу и бренду (Информация о детали)"
      operationId: "entities"
      description: >
        <p>Один из самых популярных запросов, который предоставляет подробную информацию о различных деталях. После подключения сервиса вы сможете заполнять незаполненные поля карточек товаров, такие как штрих-код производителя, название детали, размеры детали, изображения детали, вес детали и другие характеристики.</p> <p>Сервис избавит вас от необходимости поиска и загрузки тяжелых баз данных в программу.<br> Мы постоянно обновляем базу данных, чтобы быть уверенными в том, что вы получаете самую свежую и полезную информацию.</p>

      security:
        - ApiKeyAuth: ["access", "info"]
      parameters:
        - $ref: "#/components/parameters/code"
        - $ref: "#/components/parameters/brandOptional"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/EntityList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/parts-by-vin/cars:
    get:
      tags:
        - "Parts By VIN"
      summary: Получить автомобили по VIN коду (Детали по VIN)
      description: >
        Search for cars using either VIN code or frame number.

      operationId: "partsByVinCars"
      security:
        - ApiKeyAuth: ["access", "parts-by-vin.cars"]
      parameters:
        - $ref: "#/components/parameters/vinOrFrameQueryOptional"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/PartsByVinCars"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/parts-by-vin/cars/{carId}/results:
    get:
      tags:
        - "Parts By VIN"
      summary: Получить все детали по ID автомобиля (Детали по VIN)
      operationId: "partsByVinResults"
      security:
        - ApiKeyAuth: ["access", "parts-by-vin.results"]
      parameters:
        - $ref: "#/components/parameters/carId"
        - $ref: "#/components/parameters/timeout"
        - $ref: "#/components/parameters/language"
      responses:
        "200":
          $ref: "#/components/responses/PartsByVinCarResults"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
  /v1/relations:
    get:
      tags:
        - "Relations"
      summary: "Получить список связанных деталей (Информация о детали)"
      description: >
        <p>Запрос поможет вам получить информацию об аналогах детали.<br>  Алгоритм прост: отправляете в сервис ID детали из базы PartsIndex или пару Артикул + Бренд и получаете аналоги.</p>  <p>Поиск аналогов осуществляется по сумме всех, указанных в запросе, параметров.<br>  Все параметры соединяются через "and".</p>

      operationId: "relations"
      security:
        - ApiKeyAuth: ["access", "relations"]
      parameters:
        - $ref: "#/components/parameters/partIdQuery"
        - $ref: "#/components/parameters/codeParam"
        - $ref: "#/components/parameters/brandParam"
        - $ref: "#/components/parameters/typesQuery"
      responses:
        "200":
          $ref: "#/components/responses/EntityRelationList"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        default:
          $ref: "#/components/responses/default"
components:
  headers:
    X-Message:
      description: "Hint returned when dataset is empty"
      schema:
        type: "string"
        example: "no data for this request in our database"
  parameters:
    barcode:
      name: "barcode"
      in: query
      description: "Штрих-код детали"
      required: true
      schema:
        type: "string"
      example: "9100533340"
    brandParam:
      name: "brand"
      in: "query"
      description: "Название бренда.<br>\nОбязательный параметр вместе с переданным значением Code.\n"
      required: true
      schema:
        type: "string"
      example: "Narva"
    brandIdPath:
      name: "brandId"
      in: "path"
      description: "ID бренда"
      required: true
      schema:
        type: "string"
    brandOptional:
      name: "brand"
      in: "query"
      description: "Название бренда"
      schema:
        type: "string"
      example: "Philips"
    carEngineId:
      name: "car[engineId]"
      in: "query"
      description: "ID двигателя"
      required: false
      schema:
        type: "string"
    carGenerationId:
      name: "car[generationId]"
      in: "query"
      description: "ID поколения"
      required: false
      schema:
        type: "string"
    carId:
      name: "carId"
      in: path
      required: true
      schema:
        type: "string"
    catalogId:
      name: "catalogId"
      in: path
      required: true
      description: "ID каталога"
      schema:
        type: "string"
        enum:
          - "accessories"
          - "auto_chemistry"
          - "auto_products"
          - "bearings"
          - "brake_tubes"
          - "car_battery"
          - "drive_belts"
          - "engine_valves"
          - "exhaust_system"
          - "filter_air"
          - "fuses"
          - "lamps"
          - "oils"
          - "parts_plugs"
          - "parts_to"
          - "tools"
          - "tyres"
          - "wheels"
          - "wipers"
    code:
      name: "code"
      in: "query"
      description: "Артикул детали"
      required: true
      schema:
        type: "string"
      example: "11972U50CWX2"
    codeParam:
      name: "code"
      in: "query"
      description: "Артикул детали.<br>\nОбязательный параметр вместе с переданным значением Brand.\n"
      required: true
      schema:
        type: "string"
