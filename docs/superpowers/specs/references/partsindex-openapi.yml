    typesQuery:
      name: "types"
      in: "query"
      description: "Список типов отношений, разделённых запятыми.\n\nДоступные типы связей:\n- **alternative** - Альтернативой Детали (Бренд Артикул Название) является Деталь (Связанная деталь Бренд Артикул Название)\n- **analog** - Аналог (А = В)\n- **analog_other_side** - Аналог парный с одной стороны (Бренд Артикул Название) имеет парную Деталь с другой стороны (Связанная деталь Бренд Артикул Название)\n- **analog_part_of** - Деталь (Бренд Артикул Название) входит в состав Детали - узла (Связанная деталь Бренд Артикул Название)\n- **analog_repair** - Аналог с рем размерами (Бренд Артикул Название) равен Аналогу с ремонтным размером (Связанная деталь Бренд Артикул Название)\n- **has_analog** - Деталь - узел (Бренд Артикул Название) имеет в своем составе Деталь (Связанная деталь Бренд Артикул Название)\n- **kit_of_parts** - Комплект (Бренд Артикул Название) содержит в составе Деталь (Связанная деталь Бренд Артикул Название)\n- **original_alternative** - Оригинал альтернативной запчасти\n- **original_replacement** - Замена, новая Деталь (Бренд Артикул Название) заменила старую Деталь (Связанная деталь Бренд Артикул Название)\n- **part_for_repair_kit** - Деталь - узел (Бренд Артикул Название) возможно отремонтировать этим Ремкомплектом (Связанная деталь Бренд Артикул Название)\n- **part_in_repair_kit** - Деталь (Бренд Артикул Название) входит в состав Ремкомплекта (Связанная деталь Бренд Артикул Название)\n- **part_of_kit** - Деталь (Бренд Артикул Название) входит в состав Комплекта (Связанная деталь Бренд Артикул Название)\n- **possible_analog** - Аналог возможный\n- **related_part** - для Детали (Бренд Артикул Название) сопутствующая Деталь (Связанная деталь Бренд Артикул Название)\n- **repair_kit_for_part** - Ремкомплект (Бренд Артикул Название) для ремонта Детали - узла (Связанная деталь Бренд Артикул Название)\n- **repair_kit_in_part** - Ремкомплект (Бренд Артикул Название) содержит в составе Деталь (Связанная деталь Бренд Артикул Название)\n- **replacement** - Замена, старую Деталь (Бренд Артикул Название) заменили на новую Деталь (Связанная деталь Бренд Артикул Название)\n"
      required: true
      schema:
        type: "string"
        enum:
          - "all"
          - "alternative"
          - "analog"
          - "analog_other_side"
          - "analog_part_of"
          - "analog_repair"
          - "has_analog"
          - "kit_of_parts"
          - "original_alternative"
          - "original_replacement"
          - "part_for_repair_kit"
          - "part_in_repair_kit"
          - "part_of_kit"
          - "possible_analog"
          - "related_part"
          - "repair_kit_for_part"
          - "repair_kit_in_part"
          - "replacement"
      example: "all"
