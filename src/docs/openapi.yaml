        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /orders/{id}/cancel:
    patch:
      tags: [Orders]
      summary: Отмена собственного заказа
      description: Отмена собственного заказа, запрещено если заказ уже доставлен.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
