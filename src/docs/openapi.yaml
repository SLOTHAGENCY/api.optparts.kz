openapi: 3.0.3
info:
  title: optparts.kz
  version: 1.0.0
  description: |
    JWT-based authentication API with user management, product catalog, shopping cart, orders, and delivery addresses.

    ## Authentication
    Most endpoints require a Bearer JWT token. Obtain one via `/auth/login` or `/auth/register`, then pass it as:
    ```
    Authorization: Bearer <token>
    ```

    ## Roles
    | Role | Value |
    |------|-------|
    | User | `user` |
    | Manager | `manager` |
    | Admin | `admin` |

servers:
  - url: /api
    description: Local server

tags:
  - name: Auth
    description: Registration, login, logout and profile management
  - name: Categories
    description: Product categories — public read, admin/manager write
  - name: Brands
    description: Product brands — public read, admin/manager write
  - name: Products
    description: Product catalog with images and custom properties
  - name: Cart
    description: Per-user shopping cart
  - name: Addresses
    description: User delivery addresses — one can be marked as main
  - name: Orders
    description: Place and manage orders with locked-in prices

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ─── Users ───────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          format: email
          example: jane@example.com
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        roles:
          type: array
          items:
            type: string
            enum: [user, manager, admin]
          example: [user]
        profileImage:
          type: string
          nullable: true
          example: 1700000000000-123456789.jpg
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'

    # ─── Categories ──────────────────────────────────────────────────────────
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: c1d2e3f4-a5b6-7890-cdef-123456789012
        name:
          type: string
          example: Electronics
        description:
          type: string
          nullable: true
          example: Electronic devices and accessories
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Brands ──────────────────────────────────────────────────────────────
    Brand:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: b1c2d3e4-f5a6-7890-bcde-123456789012
        name:
          type: string
          example: SoundMax
        description:
          type: string
          nullable: true
          example: Premium audio equipment
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Products ────────────────────────────────────────────────────────────
    ProductImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filepath:
          type: string
          example: /uploads/products/1700000000000-abc.jpg
        order:
          type: integer
          example: 0
        productId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    ProductProperty:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: Color
        value:
          type: string
          example: Midnight Black
        productId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: p1q2r3s4-t5u6-7890-vwxy-123456789012
        sku:
          type: string
          example: SKU-WH-001
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          format: float
          example: 79.99
        categoryId:
          type: string
          format: uuid
          nullable: true
        category:
          $ref: '#/components/schemas/Category'
        brandId:
          type: string
          format: uuid
          nullable: true
        brand:
          $ref: '#/components/schemas/Brand'
        images:
          type: array
          items:
            $ref: '#/components/schemas/ProductImage'
        properties:
          type: array
          items:
            $ref: '#/components/schemas/ProductProperty'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        product:
          $ref: '#/components/schemas/Product'
        quantity:
          type: integer
          example: 2
        subtotal:
          type: number
          example: 159.98

    Cart:
      type: object
      properties:
        id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        totalAmount:
          type: number
          example: 159.98

    # ─── Addresses ───────────────────────────────────────────────────────────
    Address:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Home
        street:
          type: string
          example: 123 Abay Ave
        city:
          type: string
          example: Almaty
        postcode:
          type: string
          example: "050000"
        main:
          type: boolean
          example: true
        userId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Orders ──────────────────────────────────────────────────────────────
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
          nullable: true
        productName:
          type: string
          example: Wireless Headphones
        productSku:
          type: string
          example: SKU-WH-001
        priceAtOrder:
          type: number
          example: 79.99
          description: Price locked at the time the order was placed
        quantity:
          type: integer
          example: 2
        subtotal:
          type: number
          example: 159.98

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        address:
          $ref: '#/components/schemas/Address'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [new, paid, pending, delivered, cancelled]
          example: new
        statusLabel:
          type: string
          example: Новый
          description: Human-readable Russian label for the status
        totalAmount:
          type: number
          example: 159.98
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ─── Errors ───────────────────────────────────────────────────────────────
    ValidationError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: array
          items:
            type: string
          example: ["email must be an email", "password must be at least 8 characters"]
        error:
          type: string
          example: Bad Request

    UnauthorizedError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 401
        message:
          type: string
          example: Access denied. Please log in.
        error:
          type: string
          example: Unauthorized

    ForbiddenError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 403
        message:
          type: string
          example: Insufficient permissions.
        error:
          type: string
          example: Forbidden

    NotFoundError:
      type: object
      properties:
        statusCode:
          type: integer
          example: 404
        message:
          type: string
          example: Resource not found.
        error:
          type: string
          example: Not Found

security:
  - bearerAuth: []

paths:

  # ═══════════════════════════════════════════════════════════════════════════
  # AUTH
  # ═══════════════════════════════════════════════════════════════════════════
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, firstName, lastName]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  minLength: 8
                  example: securepass123
                firstName:
                  type: string
                  example: Jane
                lastName:
                  type: string
                  example: Doe
      responses:
        '201':
          description: Registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error or email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Авторизация
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: jane@example.com
                password:
                  type: string
                  example: securepass123
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout — выход из системы
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully. Please discard your token.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Получение данных текущего авторизованного пользователя
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /auth/profile:
    get:
      tags: [Auth]
      summary: Получение профиля текущего пользователя
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    put:
      tags: [Auth]
      summary: Обновление профиля пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Janet
                lastName:
                  type: string
                  example: Doe
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /auth/profile/image:
    post:
      tags: [Auth]
      summary: Загрузка аватарки профиля (multipart/form-data).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Profile image updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  # ═══════════════════════════════════════════════════════════════════════════
  # CATEGORIES
  # ═══════════════════════════════════════════════════════════════════════════
  /categories:
    get:
      tags: [Categories]
      summary: Получение списка всех категорий
      security: []
      responses:
        '200':
          description: Array of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      tags: [Categories]
      summary: Создание категории (admin / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: Electronics
                description:
                  type: string
                  example: Electronic devices and accessories
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Получение категории по ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    put:
      tags: [Categories]
      summary: Обновление категории (admin / manager).
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Categories]
      summary: Удаление категории (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  # ═══════════════════════════════════════════════════════════════════════════
  # BRANDS
  # ═══════════════════════════════════════════════════════════════════════════
  /brands:
    get:
      tags: [Brands]
      summary: Получение списка всех брендов
      security: []
      responses:
        '200':
          description: Array of brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
    post:
      tags: [Brands]
      summary: Создание бренда (администратор / менеджер)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: SoundMax
                description:
                  type: string
                  example: Premium audio equipment
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /brands/{id}:
    get:
      tags: [Brands]
      summary: Получение бренда по ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Brand
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    put:
      tags: [Brands]
      summary: Обновление бренда (admin / manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Brand updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Brands]
      summary: Удаление бренда (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  # ═══════════════════════════════════════════════════════════════════════════
  # PRODUCTS
  # ═══════════════════════════════════════════════════════════════════════════
  /products:
    get:
      tags: [Products]
      summary: Получение списка всех товаров
      security: []
      responses:
        '200':
          description: Array of products with images, properties, category and brand
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      tags: [Products]
      summary: Создание товара (admin / manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, price]
              properties:
                sku:
                  type: string
                  example: SKU-WH-001
                name:
                  type: string
                  example: Wireless Headphones
                price:
                  type: number
                  example: 79.99
                categoryId:
                  type: string
                  format: uuid
                  nullable: true
                brandId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /products/{id}:
    get:
      tags: [Products]
      summary: Получение товара по ID
      security: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    put:
      tags: [Products]
      summary: Обновление товара (admin / manager)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                price:
                  type: number
                categoryId:
                  type: string
                  format: uuid
                  nullable: true
                brandId:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Products]
      summary: Удаление товара (admin)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /products/{id}/images:
    post:
      tags: [Products]
      summary: Загрузка изображений товара (admin / manager)
      description: Загрузка изображений товара. Сохранение файлов на диск, путь сохраняется в БД
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Images uploaded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductImage'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /products/{id}/images/{imageId}:
    delete:
      tags: [Products]
