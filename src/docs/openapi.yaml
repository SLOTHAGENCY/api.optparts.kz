  # ADDRESSES
  # ═══════════════════════════════════════════════════════════════════════════
  /addresses:
    get:
      tags: [Addresses]
      summary: Получение всех адресов текущего пользователя
      description: Получение всех адресов текущего пользователя (основной адрес выводится первым)
      responses:
        '200':
          description: Array of addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Address'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    post:
      tags: [Addresses]
      summary: Создание адреса
      description: Создание адреса, при main: true автоматически снимает основной статус с предыдущего адреса
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, street, city, postcode]
              properties:
                title:
                  type: string
                  example: Home
                street:
                  type: string
                  example: 123 Abay Ave
                city:
                  type: string
                  example: Almaty
                postcode:
                  type: string
                  example: "050000"
                main:
                  type: boolean
                  example: false
      responses:
        '201':
          description: Address created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'

  /addresses/{id}:
    get:
      tags: [Addresses]
      summary: Получение адреса по ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Address belongs to another user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    put:
      tags: [Addresses]
      summary: Обновление полей адреса
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                street:
                  type: string
                city:
                  type: string
                postcode:
                  type: string
                main:
                  type: boolean
      responses:
        '200':
          description: Address updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
    delete:
      tags: [Addresses]
      summary: Удаление адреса
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

