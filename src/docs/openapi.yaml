  # ═══════════════════════════════════════════════════════════════════════════
  # ORDERS
  # ═══════════════════════════════════════════════════════════════════════════
  /orders:
    get:
      tags: [Orders]
      summary: Получение заказов текущего пользователя
      responses:
        '200':
          description: Array of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
    post:
      tags: [Orders]
      summary: Создание нового заказа
      description: Создание нового заказа, при этом цены фиксируются на момент оформления
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                addressId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Must be one of the user's saved addresses
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [productId, quantity]
                    properties:
                      productId:
                        type: string
                        format: uuid
                      quantity:
                        type: integer
                        minimum: 1
                        example: 2
            example:
              addressId: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              items:
                - productId: p1q2r3s4-t5u6-7890-vwxy-123456789012
                  quantity: 2
                - productId: b2c3d4e5-f6a7-8901-bcde-f12345678901
                  quantity: 1
      responses:
        '201':
          description: Order placed with locked-in prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Validation error or empty items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '404':
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'

  /orders/all:
    get:
      tags: [Orders]
      summary: Получение списка всех заказов (admin / manager).
      responses:
        '200':
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

