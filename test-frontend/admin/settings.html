<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Настройки — Админ</title>
  <link rel="stylesheet" href="../styles.css" />
</head>
<body>
  <div id="nav"></div>
  <h1>Настройки системы</h1>
  <div id="msg" class="msg"></div>

  <form id="settings-form">
    <label>DEFAULT_MARKUP_PERCENT</label>
    <input id="field-default-markup" type="number" step="0.01" min="0" placeholder="например 20" />

    <label>FX_BUFFER_PERCENT</label>
    <input id="field-fx-buffer" type="number" step="0.01" min="0" placeholder="например 2" />

    <label>DELIVERY_BUFFER_DAYS</label>
    <input id="field-delivery-buffer" type="number" step="1" min="0" placeholder="например 3" />

    <h2 style="font-size:16px;margin-top:20px;">Курсы валют (FX_RATES)</h2>
    <div id="fx-rows"></div>
    <button type="button" id="add-fx-row">+ Добавить валюту</button>

    <br />
    <button type="submit" style="margin-top:16px;">Сохранить</button>
  </form>

  <script src="../app.js"></script>
  <script>
    requireAuth();

    function addFxRow(currency, rate) {
      const wrap = document.getElementById('fx-rows');
      const row = document.createElement('div');
      row.className = 'fx-row';
      row.style.cssText = 'display:flex;gap:8px;align-items:center;margin:4px 0;';

      const codeInput = document.createElement('input');
      codeInput.type = 'text';
      codeInput.maxLength = 10;
      codeInput.placeholder = 'Код (напр. RUB)';
      codeInput.value = currency || '';
      codeInput.style.cssText = 'width:90px;flex-shrink:0;';
      codeInput.className = 'fx-currency';

      const rateInput = document.createElement('input');
      rateInput.type = 'number';
      rateInput.step = 'any';
      rateInput.min = '0';
      rateInput.placeholder = 'Курс';
      rateInput.value = rate != null ? rate : '';
      rateInput.style.cssText = 'width:120px;flex-shrink:0;';
      rateInput.className = 'fx-rate';

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.textContent = '×';
      removeBtn.style.cssText = 'padding:4px 8px;margin-top:0;';
      removeBtn.onclick = () => row.remove();

      row.append(codeInput, rateInput, removeBtn);
      wrap.appendChild(row);
    }

    async function load() {
      showMsg('msg', 'Загрузка...', '');
      try {
        const data = await api('/api/settings');
        document.getElementById('field-default-markup').value =
          data.DEFAULT_MARKUP_PERCENT != null ? data.DEFAULT_MARKUP_PERCENT : '';
        document.getElementById('field-fx-buffer').value =
          data.FX_BUFFER_PERCENT != null ? data.FX_BUFFER_PERCENT : '';
        document.getElementById('field-delivery-buffer').value =
          data.DELIVERY_BUFFER_DAYS != null ? data.DELIVERY_BUFFER_DAYS : '';

        const fxRates = data.FX_RATES || {};
        // Ensure standard currencies appear first
        ['RUB', 'USD', 'KZT'].forEach((cur) => {
          if (Object.prototype.hasOwnProperty.call(fxRates, cur)) {
            addFxRow(cur, fxRates[cur]);
          }
        });
        // Then any additional currencies
        Object.keys(fxRates).forEach((cur) => {
          if (!['RUB', 'USD', 'KZT'].includes(cur)) {
            addFxRow(cur, fxRates[cur]);
          }
        });

        showMsg('msg', '', '');
      } catch (err) {
        showMsg('msg', 'Ошибка загрузки: ' + err.message, 'err');
      }
    }

    document.getElementById('add-fx-row').addEventListener('click', () => addFxRow('', ''));

    document.getElementById('settings-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const defaultMarkup = document.getElementById('field-default-markup').value;
      const fxBuffer = document.getElementById('field-fx-buffer').value;
      const deliveryBuffer = document.getElementById('field-delivery-buffer').value;

      const fxRates = {};
      document.querySelectorAll('.fx-row').forEach((row) => {
        const cur = row.querySelector('.fx-currency').value.trim().toUpperCase();
        const rate = row.querySelector('.fx-rate').value;
        if (cur && rate !== '') fxRates[cur] = parseFloat(rate);
      });

      const payload = { FX_RATES: fxRates };
      if (defaultMarkup !== '') payload.DEFAULT_MARKUP_PERCENT = parseFloat(defaultMarkup);
      if (fxBuffer !== '') payload.FX_BUFFER_PERCENT = parseFloat(fxBuffer);
      if (deliveryBuffer !== '') payload.DELIVERY_BUFFER_DAYS = Number(deliveryBuffer);

      try {
        await api('/api/settings', { method: 'PUT', body: JSON.stringify(payload) });
        showMsg('msg', 'Настройки сохранены.', 'ok');
      } catch (err) {
        showMsg('msg', 'Ошибка сохранения: ' + err.message, 'err');
      }
    });

    load();
  </script>
</body>
</html>
