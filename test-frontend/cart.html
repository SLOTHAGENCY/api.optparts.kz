<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Корзина — тест</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="nav"></div>
  <h1>Корзина</h1>
  <div id="msg" class="msg"></div>
  <div id="cart"></div>

  <div id="checkoutBox" style="display:none;">
    <div class="section-title">Оформление</div>
    <label>Способ получения</label>
    <label><input type="radio" name="deliveryType" value="delivery" checked /> Доставка</label>
    <label><input type="radio" name="deliveryType" value="pickup" /> Самовывоз</label>

    <div id="addressRow">
      <label>Адрес доставки</label>
      <select id="addressSelect"></select>
      <div id="addrHint" class="msg"></div>
    </div>

    <p><button id="checkout">Оформить заказ</button></p>
  </div>

  <script src="app.js"></script>
  <script>
    requireAuth();

    async function load() {
      showMsg('msg', 'Загрузка (живая проверка цен у партнёров)...', '');
      const wrap = document.getElementById('cart');
      wrap.innerHTML = '';
      try {
        const cart = await api('/api/cart');
        document.getElementById('checkoutBox').style.display = cart.items.length ? '' : 'none';
        if (!cart.items.length) { showMsg('msg', 'Корзина пуста.', ''); return; }
        showMsg('msg', cart.hasChanges ? 'Внимание: цены/наличие изменились с момента добавления.' : '', cart.hasChanges ? 'err' : '');
        const table = document.createElement('table');
        table.innerHTML = '<thead><tr><th>Бренд</th><th>Название</th><th>Поставщик</th>' +
          '<th>Цена при добавл.</th><th>Текущая</th><th>Кол-во</th><th>Сумма</th><th>Наличие</th><th></th></tr></thead>';
        const tb = document.createElement('tbody');
        cart.items.forEach((it) => {
          const tr = document.createElement('tr');
          const priceCell = it.priceChanged
            ? '<span class="changed">' + money(it.currentPrice) + '</span>'
            : money(it.currentPrice);
          const maxQty = it.maxQuantity != null ? it.maxQuantity : Infinity;
          const maxLabel = it.maxQuantity != null ? '<span class="muted"> макс. ' + it.maxQuantity + '</span>' : '';
          tr.innerHTML =
            '<td>' + it.brand + '</td>' +
            '<td>' + it.productName + '</td>' +
            '<td>' + (it.supplierName || it.supplierCode) + '</td>' +
            '<td>' + money(it.priceAtAdd) + '</td>' +
            '<td>' + priceCell + '</td>' +
            '<td>' + it.quantity + maxLabel + '</td>' +
            '<td>' + money(it.subtotal) + '</td>' +
            '<td>' + (it.available ? 'есть' : '<span class="gone">нет</span>') + '</td>';
          const actions = document.createElement('td');
          actions.className = 'row-actions';
          const inc = document.createElement('button'); inc.textContent = '+';
          inc.disabled = it.quantity >= maxQty;
          inc.onclick = () => updateQty(it.id, it.quantity + 1, tr);
          const dec = document.createElement('button'); dec.textContent = '−';
          dec.onclick = () => updateQty(it.id, it.quantity - 1, tr);
          dec.disabled = it.quantity <= 1;
          const del = document.createElement('button'); del.textContent = '×';
          del.onclick = () => removeItem(it.id);
          actions.append(dec, inc, del);
          tr.appendChild(actions);
          tb.appendChild(tr);
        });
        table.appendChild(tb);
        wrap.appendChild(table);
        const total = document.createElement('p');
        total.innerHTML = '<b>Итого: ' + money(cart.totalAmount) + '</b>';
        wrap.appendChild(total);
      } catch (err) {
        showMsg('msg', 'Ошибка: ' + err.message, 'err');
      }
    }

    async function updateQty(id, qty, tr) {
      try {
        await api('/api/cart/items/' + id, { method: 'PUT', body: JSON.stringify({ quantity: qty }) });
        load();
      } catch (err) {
        if (err.status === 400) {
          showMsg('msg', err.message, 'err');
        } else {
          showMsg('msg', 'Ошибка: ' + err.message, 'err');
        }
      }
    }
    async function removeItem(id) {
      try { await api('/api/cart/items/' + id, { method: 'DELETE' }); load(); }
      catch (err) { showMsg('msg', 'Ошибка: ' + err.message, 'err'); }
    }

    // ===== Оформление =====
    function selectedDeliveryType() {
      const el = document.querySelector('input[name="deliveryType"]:checked');
      return el ? el.value : 'delivery';
    }

    async function loadAddresses() {
      const sel = document.getElementById('addressSelect');
      const hint = document.getElementById('addrHint');
      sel.innerHTML = '';
      hint.textContent = '';
      try {
        const list = await api('/api/addresses');
        if (!list.length) {
          sel.style.display = 'none';
          hint.innerHTML = 'Нет сохранённых адресов. <a href="profile.html">Добавьте адрес</a> или выберите самовывоз.';
          return;
        }
        sel.style.display = '';
        list.forEach((a) => {
          const opt = document.createElement('option');
          opt.value = a.id;
          opt.textContent = a.title + ' — ' + [a.street, a.city, a.postcode].filter(Boolean).join(', ') + (a.main ? ' (основной)' : '');
          if (a.main) opt.selected = true;
          sel.appendChild(opt);
        });
      } catch (err) {
        hint.textContent = 'Не удалось загрузить адреса: ' + err.message;
      }
    }

    function syncAddressRow() {
      document.getElementById('addressRow').style.display =
        selectedDeliveryType() === 'delivery' ? '' : 'none';
    }
    document.querySelectorAll('input[name="deliveryType"]').forEach((r) =>
      r.addEventListener('change', syncAddressRow),
    );

    document.getElementById('checkout').addEventListener('click', async () => {
      const deliveryType = selectedDeliveryType();
      const payload = { deliveryType };
      if (deliveryType === 'delivery') {
        const sel = document.getElementById('addressSelect');
        if (!sel.value) {
          showMsg('msg', 'Выберите адрес доставки или оформите самовывоз.', 'err');
          return;
        }
        payload.addressId = sel.value;
      }
      showMsg('msg', 'Оформление...', '');
      try {
        await api('/api/orders', { method: 'POST', body: JSON.stringify(payload) });
        location.href = 'orders.html';
      } catch (err) {
        if (err.status === 409) {
          const changes = (err.body && err.body.changes) ? JSON.stringify(err.body.changes) : '';
          showMsg('msg', 'Цены/наличие изменились — обновите корзину и подтвердите. ' + changes, 'err');
          load();
        } else {
          showMsg('msg', 'Ошибка: ' + err.message, 'err');
        }
      }
    });

    load();
    loadAddresses();
    syncAddressRow();
  </script>
</body>
</html>
